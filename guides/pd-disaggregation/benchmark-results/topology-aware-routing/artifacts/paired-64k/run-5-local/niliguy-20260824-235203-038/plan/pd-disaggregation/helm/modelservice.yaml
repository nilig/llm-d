# Source: llm-d-modelservice/templates/decode-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-g-a6a03f4d-oss-120b-decode
  labels:
    helm.sh/chart: llm-d-modelservice-v0.4.16
    app.kubernetes.io/version: "v0.4.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/inference-serving: "true"
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: openai-g-a6a03f4d-oss-120b
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/guide: pd-disaggregation
        llm-d.ai/inference-serving: "true"
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: openai-g-a6a03f4d-oss-120b
        llm-d.ai/role: decode
    spec:
      initContainers:
        - name: routing-proxy
          args:
            - --port=8000
            - --model-server-port=8200
            - --kv-connector=nixlv2
            - --zap-encoder=json
            - --zap-log-level=debug
            - --secure-proxy=false
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources: {}
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
        - command:
          - set_llmdbench_environment.py
          - -e
          - /shared-config/llmdbench_env.sh
          - -i
          env:
          - name: VLLM_IS_DECODE
            value: "1"
          - name: HOME
            value: /tmp
          - name: USER
            value: llm-d
          - name: HF_HOME
            value: /tmp/huggingface
          - name: MODEL_NAME
            value: openai/gpt-oss-120b
          - name: MODEL_PATH
            value: models/openai/gpt-oss-120b
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: "120"
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_INFERENCE_PORT
            value: "8000"
          - name: VLLM_METRICS_PORT
            value: "8200"
          - name: VLLM_BLOCK_SIZE
            value: "128"
          - name: VLLM_MAX_MODEL_LEN
            value: "16384"
          - name: VLLM_LOAD_FORMAT
            value: auto
          - name: VLLM_ACCELERATOR_MEM_UTIL
            value: "0.9"
          - name: VLLM_MAX_NUM_SEQ
            value: "256"
          - name: VLLM_TENSOR_PARALLELISM
            value: "2"
          - name: VLLM_MAX_NUM_BATCHED_TOKENS
            value: "256"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5557"
          - name: UCX_TLS
            value: sm,cuda_ipc,cuda_copy,tcp
          - name: UCX_SOCKADDR_TLS_PRIORITY
            value: tcp
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: LLMDBENCH_POD_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: NCCL_EXCLUDE_IB_HCA
            value: mlx5_0,mlx5_2,mlx5_4,mlx5_8,mlxl5_7,mlx5_10,mlx5_12,mlx5_14,mlx5_16
          - name: NVSHMEM_DEBUG
            value: none
          - name: NCCL_DEBUG
            value: WARN
          - name: NIXL_LOG_LEVEL
            value: debug
          - name: UCX_MAX_RMA_RAILS
            value: "1"
          image: ghcr.io/llm-d/llm-d-benchmark:v0.8.0
          imagePullPolicy: Always
          name: preprocess
          volumeMounts:
          - mountPath: /shared-config
            name: shared-config

      schedulerName: default-scheduler
      serviceAccountName: openai-g-a6a03f4d-oss-120b

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                    - NVIDIA-H200
      volumes:
        - emptyDir: {}
          name: shared-config
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm

        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
            readOnly: true

      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.26.0

          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 10
            periodSeconds: 5
            tcpSocket:
              port: 8200
            timeoutSeconds: 15
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /health
              port: 8200
            periodSeconds: 5
            timeoutSeconds: 15
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RAWIO
              - NET_ADMIN
              - NET_RAW
            runAsGroup: 0
            runAsUser: 0
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
          args:
            - |
              /bin/true ; export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
              export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}

              . /shared-config/llmdbench_env.sh
              vllm serve /model-cache/$MODEL_PATH \
              --host 0.0.0.0 \
              --served-model-name $MODEL_NAME \
              --port $VLLM_METRICS_PORT \
              --block-size $VLLM_BLOCK_SIZE \
              --max-model-len $VLLM_MAX_MODEL_LEN \
              --max-num-seq $VLLM_MAX_NUM_SEQ \
              --max-num-batched-tokens $VLLM_MAX_NUM_BATCHED_TOKENS \
              --tensor-parallel-size $TP_SIZE \
              --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
              --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
              --disable-uvicorn-access-log \
              --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
              --no-enable-prefix-caching \
              --dtype bfloat16 \
               \
              --no-disable-hybrid-kv-cache-manager
          env:
          - name: VLLM_IS_DECODE
            value: "1"
          - name: HOME
            value: /tmp
          - name: USER
            value: llm-d
          - name: HF_HOME
            value: /tmp/huggingface
          - name: MODEL_NAME
            value: openai/gpt-oss-120b
          - name: MODEL_PATH
            value: models/openai/gpt-oss-120b
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: "120"
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_INFERENCE_PORT
            value: "8000"
          - name: VLLM_METRICS_PORT
            value: "8200"
          - name: VLLM_BLOCK_SIZE
            value: "128"
          - name: VLLM_MAX_MODEL_LEN
            value: "16384"
          - name: VLLM_LOAD_FORMAT
            value: auto
          - name: VLLM_ACCELERATOR_MEM_UTIL
            value: "0.9"
          - name: VLLM_MAX_NUM_SEQ
            value: "256"
          - name: VLLM_TENSOR_PARALLELISM
            value: "2"
          - name: VLLM_MAX_NUM_BATCHED_TOKENS
            value: "256"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5557"
          - name: UCX_TLS
            value: sm,cuda_ipc,cuda_copy,tcp
          - name: UCX_SOCKADDR_TLS_PRIORITY
            value: tcp
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: LLMDBENCH_POD_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: NCCL_EXCLUDE_IB_HCA
            value: mlx5_0,mlx5_2,mlx5_4,mlx5_8,mlxl5_7,mlx5_10,mlx5_12,mlx5_14,mlx5_16
          - name: NVSHMEM_DEBUG
            value: none
          - name: NCCL_DEBUG
            value: WARN
          - name: NIXL_LOG_LEVEL
            value: debug
          - name: UCX_MAX_RMA_RAILS
            value: "1"
          - name: DP_SIZE
            value: "1"
          - name: TP_SIZE
            value: "2"
          - name: DP_SIZE_LOCAL
            value: "1"


          resources:
            limits:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "2"
              rdma/ib: "1"
            requests:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "2"
              rdma/ib: "1"

          volumeMounts:
            - mountPath: /shared-config
              name: shared-config
            - mountPath: /dev/shm
              name: dshm
            - name: model-storage
              mountPath: /model-cache
              readOnly: true


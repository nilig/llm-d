router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    replicas: 1
    flags:
      v: 2
    pluginsConfigFile: topology-config.yaml
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

  modelServers:
    matchLabels:
      llm-d.ai/guide: topology-aware-benchmark

  proxy:
    args:
      - --service-node
      - envoy-sidecar
      - --log-level
      - warn
      - --concurrency
      - "8"
      - --drain-strategy
      - immediate
      - --drain-time-s
      - "60"
      - -c
      - /etc/envoy/envoy.yaml
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

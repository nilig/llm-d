apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: "-0"
patches:
  - target:
      kind: DisaggregatedSet
      name: pd-topology
    patch: |-
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/metadata/labels/llm-d.ai~1topology-slice
        value: "0"
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/nodeSelector
        value:
          kubernetes.io/hostname: g11bab6
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/metadata/labels/llm-d.ai~1topology-slice
        value: "0"
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/nodeSelector
        value:
          kubernetes.io/hostname: g11bab6

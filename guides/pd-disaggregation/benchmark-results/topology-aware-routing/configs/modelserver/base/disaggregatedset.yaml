apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-topology
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/guide: topology-aware-benchmark
    llm-d.ai/model: gpt-oss-120b
spec:
  roles:
    - name: prefill
      spec:
        replicas: 4
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: topology-aware-benchmark
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: prefill
            spec:
              tolerations:
                - key: is_gpu
                  operator: Exists
                  effect: PreferNoSchedule
              containers:
                - name: modelserver
                  image: vllm/vllm-openai:v0.23.0
                  imagePullPolicy: IfNotPresent
                  command: ["vllm", "serve"]
                  args:
                    - openai/gpt-oss-120b
                    - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
                    - --tensor-parallel-size=1
                    - --block-size=128
                    - --kv-transfer-config
                    - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
                    - --no-disable-hybrid-kv-cache-manager
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HOME
                      value: /models
                    - name: USER
                      value: llm-d
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                  ports:
                    - name: modelserver
                      containerPort: 8000
                    - name: nixl
                      containerPort: 5600
                  resources:
                    requests:
                      cpu: "8"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                      rdma/ib: "1"
                    limits:
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                      rdma/ib: "1"
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - name: shm
                      mountPath: /dev/shm
                    - name: model-cache
                      mountPath: /models
                    - name: torch-compile-cache
                      mountPath: /.cache
                    - name: vllm-config
                      mountPath: /.config
                    - name: triton-cache
                      mountPath: /.triton
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: topology-aware-model-cache
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}

    - name: decode
      spec:
        replicas: 1
        rolloutStrategy:
          type: RollingUpdate
          rollingUpdateConfiguration:
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/guide: topology-aware-benchmark
                llm-d.ai/model: gpt-oss-120b
                llm-d.ai/role: decode
            spec:
              tolerations:
                - key: is_gpu
                  operator: Exists
                  effect: PreferNoSchedule
              initContainers:
                - name: routing-proxy
                  image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0
                  imagePullPolicy: IfNotPresent
                  restartPolicy: Always
                  args:
                    - --port=8000
                    - --vllm-port=8200
                    - --kv-connector=nixlv2
                    # V(4) logs the chosen prefill target without logging request bodies.
                    - --zap-log-level=4
                    - --secure-proxy=false
                  ports:
                    - name: sidecar
                      containerPort: 8000
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              containers:
                - name: modelserver
                  image: vllm/vllm-openai:v0.23.0
                  imagePullPolicy: IfNotPresent
                  command: ["vllm", "serve"]
                  args:
                    - openai/gpt-oss-120b
                    - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
                    - --tensor-parallel-size=4
                    - --block-size=128
                    - --kv-transfer-config
                    - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
                    - --no-disable-hybrid-kv-cache-manager
                    - --port=8200
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: HF_HOME
                      value: /models
                    - name: USER
                      value: llm-d
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                  ports:
                    - name: modelserver
                      containerPort: 8200
                    - name: nixl
                      containerPort: 5600
                  resources:
                    requests:
                      cpu: "16"
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                      rdma/ib: "1"
                    limits:
                      memory: 64Gi
                      nvidia.com/gpu: "4"
                      rdma/ib: "1"
                  startupProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: modelserver
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /v1/models
                      port: modelserver
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - name: shm
                      mountPath: /dev/shm
                    - name: model-cache
                      mountPath: /models
                    - name: torch-compile-cache
                      mountPath: /.cache
                    - name: vllm-config
                      mountPath: /.config
                    - name: triton-cache
                      mountPath: /.triton
              volumes:
                - name: shm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 20Gi
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: topology-aware-model-cache
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
